name: Publish

# A GitHub release publishes its tag to npm through trusted publishing: no npm token in the repository.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        id: package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          # A version published by hand, e.g. the first one, is not published again.
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.package.outputs.published != 'true'
        run: npm ci

      # `prepublishOnly` cleans `dist/` and runs the typecheck, tests and build first.
      - if: steps.package.outputs.published != 'true'
        run: npm publish
